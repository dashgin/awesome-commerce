{% extends 'partials/_base.html' %}
{% load static %}

{% block title %}
Address
{% endblock %}

{% block content %}
<!-- breadcrumb -->
<div class="container py-4 flex items-center gap-3">
    <a href="../index.html" class="text-primary text-base">
        <i class="fa-solid fa-house"></i>
    </a>
    <span class="text-sm text-gray-400">
        <i class="fa-solid fa-chevron-right"></i>
    </span>
    <p class="text-gray-600 font-medium">Profile</p>
</div>
<!-- ./breadcrumb -->

<!-- wrapper -->
<div class="container grid grid-cols-12 items-start gap-6 pt-4 pb-16">

    <!-- sidebar -->
    {% include 'partials/_sidebar.html' %}
    <!-- ./sidebar -->

    <!-- info -->
    <form action="{% url 'address-edit' address.id %}" method="post"
        class="col-span-9 shadow rounded px-6 pt-5 pb-7">
        {% csrf_token %}
        <!-- <h4 class="text-lg font-medium capitalize mb-4">
            Profile information
        </h4> -->
        
        <div class="space-y-4">
            {{ form.as_p }}
        </div>
        {% if form.errors %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
            <strong class="font-bold">Oops!</strong>
            <span class="block sm:inline">Something went wrong.</span>
        </div>
        {% endif %}

        <div class="mt-4">
            <button type="submit"
                class="py-3 px-4 text-center text-white bg-primary border border-primary rounded-md hover:bg-transparent hover:text-primary transition font-medium">
                save changes
            </button>
        </div>
    </form>
    <!-- ./info -->

</div>
<!-- ./wrapper -->


{% endblock %}
